{{- /*
ExternalSecret — pulls secrets from a secret store.
NEVER plaintext in values.yaml.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-agent-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-agent-secrets
    creationPolicy: Owner
  data:
    - secretKey: SLACK_AGENT_TOKEN
      remoteRef:
        key: helpdesk-studio/agent
        property: slack_token
    - secretKey: JIRA_AGENT_TOKEN
      remoteRef:
        key: helpdesk-studio/agent
        property: jira_token
    - secretKey: APPROVAL_TOKEN_KEY
      remoteRef:
        key: helpdesk-studio/shared
        property: approval_token_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-executor-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-executor-secrets
    creationPolicy: Owner
  data:
    - secretKey: SLACK_EXECUTOR_TOKEN
      remoteRef:
        key: helpdesk-studio/executor
        property: slack_token
    - secretKey: JIRA_EXECUTOR_TOKEN
      remoteRef:
        key: helpdesk-studio/executor
        property: jira_token
    - secretKey: APPROVAL_TOKEN_KEY
      remoteRef:
        key: helpdesk-studio/shared
        property: approval_token_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-web-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: helpdesk-studio/web
        property: keycloak_client_secret
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: helpdesk-studio/web
        property: nextauth_secret
