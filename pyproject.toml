[project]
name = "helpdesk-agent-studio"
version = "0.1.0"
description = "Enterprise helpdesk agent with human-in-the-loop approval boundary"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.3.0",
    "cryptography==44.0.0",
    "boto3==1.36.2",
    "authlib==1.4.1",
    "python3-saml==1.16.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-httpx==0.50b0",
    "mcp==1.3.0",
    "pyyaml==6.0.2",
    "structlog==24.4.0",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "mypy==1.14.1",
    "ruff==0.9.2",
    "httpx==0.28.1",
    "respx==0.22.0",
    "factory-boy==3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["studio.approval.*", "studio.executor.*", "studio.agent.*", "studio.audit.*"]
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "boundary: tests proving the agent cannot write",
    "integration: tests requiring the fake providers",
]
testpaths = ["tests"]
